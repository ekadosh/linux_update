---
proxmox_snapshot_retention: 3
apt_archive_path: /var/cache/apt/archives
apt_cache_valid_time: 3600
apt_lock_timeout: 600
apt_min_archive_free_mb: 512
apt_retries: 10
apt_retry_delay: 30
apt_task_timeout: 3600
post_update_health_timeout: 300
proxmox_rollback_start: true
proxmox_rollback_timeout: 300
reboot_timeout: 1800
apt_min_age_days: 7
apt_age_db_path: /var/lib/ansible-linux-update/package-first-seen.json
# Only retry apt tasks whose failure looks transient. Broken package scripts
# (dpkg configure errors) fail immediately instead of burning every retry.
apt_transient_error_patterns:
  - Could not get lock
  - Unable to acquire the dpkg frontend lock
  - Unable to lock
  - Temporary failure resolving
  - Could not connect
  - Connection timed out
  - Connection failed
  - Failed to fetch
  - Hash Sum mismatch
  - Undetermined Error
apt_transient_error_pattern: "{{ apt_transient_error_patterns | join('|') }}"
